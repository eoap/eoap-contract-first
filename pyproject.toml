[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"


[project]
name = "waterbodies-learning"
dynamic = ["version"]
description = "Contract-first EOAP Water Bodies learning and verification"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.15"

keywords = ["EOAP", "CWL", "STAC", "learning"]

classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]

dependencies = ["waterbodies==1.0.0"]

# Resolve the application checkout locally; published metadata retains its version.
[tool.uv.sources]
waterbodies = { path = "reference", editable = true }

[tool.hatch.metadata]
allow-direct-references = true

[project.urls]
Repository = "https://github.com/eoap/waterbodies-learning"

# ---------------------------------------------------------------------------
# Versioning and packaging
# ---------------------------------------------------------------------------

[tool.hatch.version]
path = "reference/src/waterbodies/__about__.py"


[tool.hatch.build.targets.sdist]
include = ["/reference", "/scripts", "/tests", "/docs", "/modules", "/supply-chain", "/README.md", "/LICENSE", "/NOTICE", "/pyproject.toml", "/Taskfile.yaml", "/mkdocs.yml", "/uv.lock", "/data"]

# This course wheel contains the authoritative contract; the application wheel
# owns the waterbodies Python namespace.
[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.wheel.force-include]
"reference/waterbodies.cwl" = "waterbodies_learning/waterbodies.cwl"

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["reference/src/waterbodies/waterbodies.py"]


[tool.ruff.lint]
select = [
  # Core correctness
  "F",      # Pyflakes
  "E",      # pycodestyle errors
  "W",      # pycodestyle warnings

  # Imports and modernization
  "I",      # isort
  "UP",     # pyupgrade
  "FA",     # future annotations
  "TC",     # type-checking imports

  # Bugs and correctness
  "B",      # flake8-bugbear
  "RET",    # flake8-return
  "PTH",    # pathlib usage
  "C4",     # comprehensions

  # Simplification and readability
  "SIM",    # flake8-simplify

  # Complexity
  "C90",    # McCabe complexity

  # Pylint-derived checks
  "PLE",    # Pylint errors
  "PLW",    # Pylint warnings
  "PLR",    # Pylint refactor/design checks

  # Performance and Ruff-specific quality checks
  "PERF",
  "RUF",
]

ignore = [
  # Formatter-controlled rules
  "E501",   # line length
  "W191",   # tab indentation
  "E111",   # indentation
  "E114",   # indentation
  "E117",   # over-indented

  # Too opinionated for a general project template.
  # Enable per repository if useful.
  "PLR0904", # too many public methods
]


[tool.ruff.lint.mccabe]
# New code should remain simple enough to review quickly.
max-complexity = 7

[tool.ruff.lint.pylint]
# Keep these deliberately stricter than Pylint defaults.
max-args = 6
max-branches = 10
max-returns = 6
max-statements = 40


# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.12"

# Strict typing is the default for new Terradue Python projects.
strict = true

# Improve diagnostics.
pretty = true
show_error_codes = true
show_error_context = true
warn_unreachable = true

# Avoid silently accepting untyped third-party APIs.
ignore_missing_imports = false

# Files checked by default.
files = [
  "reference/src/waterbodies",
  "scripts",
  "tests",
]


# The scientific APIs omit call annotations; permit only these external calls.
exclude = ["reference/src/waterbodies/waterbodies.py"]
untyped_calls_exclude = ["rasterio", "skimage", "shapely"]

[[tool.mypy.overrides]]
module = ["rasterio.*", "skimage.*", "shapely.*", "cwl2click.*", "cwl2markdown.*", "transpiler_mate.runtime.*"]
follow_untyped_imports = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

addopts = [
  "--strict-config",
  "--strict-markers",
]

xfail_strict = true


# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------

[tool.coverage.run]
source_pkgs = [
  "waterbodies",
]

branch = true
parallel = true

omit = [
  "reference/src/waterbodies/__about__.py",
  "reference/src/waterbodies/waterbodies.py",
]


[tool.coverage.paths]
waterbodies = [
  "reference/src/waterbodies",
  "*/waterbodies-learning/reference/src/waterbodies",
]


[tool.coverage.report]
show_missing = true
skip_covered = false

exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]


# ---------------------------------------------------------------------------
# Hatch: test environment
# ---------------------------------------------------------------------------

[tool.hatch.envs.test]
skip-install = false
features = ["dev", "tooling"]
# Hatch installs the project before environment dependencies and does not read uv sources.
pre-install-commands = ['python -m pip install -e "{root}/reference"']

dependencies = [
  "waterbodies @ {root:uri}/reference",
  "pytest>=8.4,<10",
  "pytest-cov>=6.2,<8",
]


[tool.hatch.envs.test.scripts]
test = "pytest {args:tests}"

testv = "pytest --verbose {args:tests}"

test-cov = "pytest --cov=waterbodies --cov-report=term-missing {args:tests}"

test-show-setup = "pytest --setup-show {args:tests}"


# Keep the default test command on the active interpreter; opt into the full matrix.
[tool.hatch.envs.test-matrix]
template = "test"

[[tool.hatch.envs.test-matrix.matrix]]
python = [
  "3.12",
  "3.13",
  "3.14",
]


# ---------------------------------------------------------------------------
# Hatch: development and quality environment
# ---------------------------------------------------------------------------

[tool.hatch.envs.dev]
skip-install = false
features = ["dev", "tooling"]
# Hatch installs the project before environment dependencies and does not read uv sources.
pre-install-commands = ['python -m pip install -e "{root}/reference"']

dependencies = [
  "waterbodies @ {root:uri}/reference",
  "mypy>=2.3.0",
  "ruff>=0.16.0",
  "bandit>=1.9.4",
  "pytest>=8.4,<10",
]


[tool.hatch.envs.dev.scripts]

# ---------------------------------------------------------------------------
# Developer commands
#
# These commands are allowed to modify files.
# ---------------------------------------------------------------------------

format = "ruff format {args:reference/src scripts tests}"

fix = [
  "ruff check --fix {args:reference/src scripts tests}",
  "ruff format {args:reference/src scripts tests}",
]


# ---------------------------------------------------------------------------
# Verification commands
#
# These commands MUST NOT modify files and are suitable for CI.
# ---------------------------------------------------------------------------

format-check = "ruff format --check {args:reference/src scripts tests}"

lint = "ruff check {args:reference/src scripts tests}"
lint-check = "ruff check {args:reference/src scripts tests}"
design-check = "ruff check --select C90,PLR {args:reference/src scripts tests}"

typecheck = "mypy {args:}"

security = "bandit -r {args:reference/src scripts} -x reference/src/waterbodies/waterbodies.py"


# Run the complete static quality gate.
quality = [
  "ruff format --check {args:reference/src scripts tests}",
  "ruff check {args:reference/src scripts tests}",
  "mypy {args:}",
  "bandit -r {args:reference/src scripts} -x reference/src/waterbodies/waterbodies.py",
]


# Complete local/CI validation including tests.
check = [
  "ruff format --check {args:reference/src scripts tests}",
  "ruff check {args:reference/src scripts tests}",
  "mypy {args:}",
  "bandit -r {args:reference/src scripts} -x reference/src/waterbodies/waterbodies.py",
  "pytest {args:tests}",
]

# Provide test extras for editable installations.
[project.optional-dependencies]
notebook = ["jupyterlab>=4,<5", "matplotlib>=3.9,<4", "nbclient>=0.10,<1"]
tooling = [
  "transpiler-mate-runtime @ git+https://github.com/transpiler-mate/transpiler-mate-runtime.git@c55100e21d9e009f5ac67147794225547666f7cd",
  "cwl-loader @ git+https://github.com/transpiler-mate/cwl-loader.git@a51369615c16443b46bf7f63d1971d4acb389174",
  "transpiler-mate-api @ git+https://github.com/transpiler-mate/transpiler-mate-api.git@850c966e4a0d9b18a94d28508fc63c189b55280c",
  "cwl2click @ git+https://github.com/transpiler-mate/cwl2click.git@43ddfd6a785c41ce9c62e28d52b7143aa654f5c3",
  "cwl2markdown @ git+https://github.com/transpiler-mate/cwl2markdown.git@17ea06d1eae4452a2e17c8b6c104dc5624122c44",
  "cwl2puml @ git+https://github.com/transpiler-mate/cwl2puml.git@3bc0efd5efdc450e58a3a60c9e5451a6dafe187f",
  "cwl2inputs @ git+https://github.com/transpiler-mate/cwl2inputs.git@f417674eb87374b39c9b7f4d5dd6cdfc8e098597",
  "cwl2ogc @ git+https://github.com/transpiler-mate/cwl2ogc.git@2ae57d69f835e39d02ecaf851bc3da9ea7cb061f",
  "cwl2oci @ git+https://github.com/transpiler-mate/cwl2oci.git@ea662e629435e7d7f556674af071a905d605bf62",
  "cwl2sbom @ git+https://github.com/transpiler-mate/cwl2sbom.git@fc707a129947508eebd1b26c46e4bee63c06a4bd",
  "cwl-baseline-plugin @ git+https://github.com/transpiler-mate/cwl-baseline-plugin.git@63d5c7697bbb6e66d5687f4ef88eb36ccc155e7e",
  "cwl2codemeta @ git+https://github.com/transpiler-mate/cwl2codemeta.git@49ff46d301d90e347861ed4d29bad838526abb57",
  "cwltool>=3.1",
  "PyYAML>=6,<7",
]
dev = ["pytest>=8,<10", "pytest-cov>=6.2,<8", "ruff>=0.16,<0.17", "mypy>=2.3,<3", "bandit>=1.9,<2", "types-PyYAML", "mkdocs-material>=9,<10"]
test = ["pytest>=8.4,<10", "pytest-cov>=6.2,<8"]
