[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"


[project]
name = "waterbodies-learning"
dynamic = ["version"]
description = "Contract-first EOAP Water Bodies learning and verification"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"

keywords = ["EOAP", "CWL", "STAC", "learning"]

classifiers = ["Development Status :: 4 - Beta", "Intended Audience :: Developers", "Programming Language :: Python", "Programming Language :: Python :: 3.12", "Programming Language :: Python :: Implementation :: CPython", "Programming Language :: Python :: Implementation :: PyPy"]

dependencies = ["waterbodies==1.0.0"]

# Resolve the application checkout locally; published metadata retains its version.
[tool.uv.sources]
waterbodies = { path = "reference", editable = true }

[tool.hatch.metadata]
allow-direct-references = true

[project.urls]
Documentation = "https://eoap.github.io/eoap-contract-first/"
Source = "https://github.com/eoap/eoap-contract-first"
Issues = "https://github.com/eoap/eoap-contract-first/issues"

[tool.hatch.version]
path = "reference/src/waterbodies/__about__.py"


[tool.hatch.build.targets.sdist]
include = ["/reference", "/scripts", "/tests", "/docs", "/modules", "/supply-chain", "/README.md", "/LICENSE", "/NOTICE", "/pyproject.toml", "/Taskfile.yaml", "/mkdocs.yml", "/uv.lock", "/data", "/src", "/requirements", "/vendor"]

# This course wheel contains the authoritative contract; the application wheel
# owns the waterbodies Python namespace.
[tool.hatch.build.targets.wheel]
packages = ["src/waterbodies_learning"]

[tool.hatch.build.targets.wheel.force-include]
"reference/waterbodies.cwl" = "waterbodies_learning/waterbodies.cwl"

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["reference/src/waterbodies/waterbodies.py"]


[tool.ruff.lint]
select = [
  # Core correctness
  "F",      # Pyflakes
  "E",      # pycodestyle errors
  "W",      # pycodestyle warnings

  # Imports and modernization
  "I",      # isort
  "UP",     # pyupgrade
  "FA",     # future annotations
  "TC",     # type-checking imports

  # Bugs and correctness
  "B",      # flake8-bugbear
  "RET",    # flake8-return
  "PTH",    # pathlib usage
  "C4",     # comprehensions

  # Simplification and readability
  "SIM",    # flake8-simplify

  # Complexity
  "C90",    # McCabe complexity

  # Pylint-derived checks
  "PLE",    # Pylint errors
  "PLW",    # Pylint warnings
  "PLR",    # Pylint refactor/design checks

  # Performance and Ruff-specific quality checks
  "PERF",
  "RUF",
]

ignore = [
  # Formatter-controlled rules
  "E501",   # line length
  "W191",   # tab indentation
  "E111",   # indentation
  "E114",   # indentation
  "E117",   # over-indented

  # Too opinionated for a general project template.
  # Enable per repository if useful.
  "PLR0904", # too many public methods
]


[tool.ruff.lint.mccabe]
# New code should remain simple enough to review quickly.
max-complexity = 7

[tool.ruff.lint.pylint]
# Keep these deliberately stricter than Pylint defaults.
max-args = 6
max-branches = 10
max-returns = 6
max-statements = 40


# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.12"

# Strict typing is the default for new Terradue Python projects.
strict = true

# Improve diagnostics.
pretty = true
show_error_codes = true
show_error_context = true
warn_unreachable = true

# Avoid silently accepting untyped third-party APIs.
ignore_missing_imports = false

# Files checked by default.
files = [
  "reference/src/waterbodies",
  "scripts",
  "tests",
]


# The scientific APIs omit call annotations; permit only these external calls.
exclude = ["reference/src/waterbodies/waterbodies.py"]
untyped_calls_exclude = ["rasterio", "skimage", "shapely"]

[[tool.mypy.overrides]]
module = ["rasterio.*", "skimage.*", "shapely.*", "cwl2click.*", "cwl2markdown.*", "transpiler_mate.runtime.*"]
follow_untyped_imports = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

addopts = [
  "--strict-config",
  "--strict-markers",
]

xfail_strict = true


# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------

[tool.coverage.run]
source_pkgs = [
  "waterbodies",
]

branch = true
parallel = true

omit = [
  "reference/src/waterbodies/__about__.py",
  "reference/src/waterbodies/waterbodies.py",
]


[tool.coverage.paths]
waterbodies = [
  "reference/src/waterbodies",
  "*/waterbodies-learning/reference/src/waterbodies",
]


[tool.coverage.report]
show_missing = true
skip_covered = false

exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]


# ---------------------------------------------------------------------------
# Hatch: test environment
# ---------------------------------------------------------------------------

[tool.hatch.envs.test]
template = "dev"

[tool.hatch.envs.test.scripts]
test = ["bootstrap", "pytest {args:tests}"]

[tool.hatch.envs.default]
template = "dev"
skip-install = false
pre-install-commands = ["uv pip install --require-hashes -r requirements/development.txt"]
post-install-commands = ["uv pip install --no-deps --no-build-isolation -e reference -e ."]

[tool.hatch.envs.dev]
skip-install = true
installer = "uv"
post-install-commands = ["uv pip install --require-hashes -r requirements/development.txt", "uv pip install --no-deps --no-build-isolation -e reference -e ."]
template = "dev"
python = "3.12"

[tool.hatch.envs.dev.scripts]

# ---------------------------------------------------------------------------
# Developer commands
#
# These commands are allowed to modify files.
# ---------------------------------------------------------------------------

format = "ruff format {args:reference/src scripts tests}"

fix = [
  "ruff check --fix {args:reference/src scripts tests}",
  "ruff format {args:reference/src scripts tests}",
]


# ---------------------------------------------------------------------------
# Verification commands
#
# These commands MUST NOT modify files and are suitable for CI.
# ---------------------------------------------------------------------------

format-check = "ruff format --check {args:reference/src scripts tests}"

lint = "ruff check {args:reference/src scripts tests}"
lint-check = "ruff check {args:reference/src scripts tests}"
design-check = "ruff check --select C90,PLR {args:reference/src scripts tests}"

typecheck = "mypy {args:}"

security = "bandit -r {args:reference/src scripts} -x reference/src/waterbodies/waterbodies.py"


# Run the complete static quality gate.
quality = ["bootstrap", "ruff format --check {args:reference/src scripts tests}", "ruff check {args:reference/src scripts tests}", "mypy {args:}", "bandit -r {args:reference/src scripts} -x reference/src/waterbodies/waterbodies.py"]


# Complete local/CI validation including tests.
check = ["bootstrap", "ruff format --check {args:reference/src scripts tests}", "ruff check {args:reference/src scripts tests}", "mypy {args:}", "bandit -r {args:reference/src scripts} -x reference/src/waterbodies/waterbodies.py", "pytest {args:tests}"]

# Provide test extras for editable installations.
bootstrap = ["uv pip install --require-hashes -r requirements/development.txt", "uv pip install --no-deps --no-build-isolation -e reference -e ."]

[project.optional-dependencies]
notebook = ["jupyterlab>=4,<5", "matplotlib>=3.9,<4", "nbclient>=0.10,<1"]
tooling = [
  "transpiler-mate-runtime==1.3.0",
  "cwl-loader==0.27.0",
  "transpiler-mate-api==1.0.1",
  "cwl2click==0.10.1",
  "cwl2markdown==0.2.1",
  "cwl2puml==0.49.1",
  "cwl2inputs==0.1.1",
  "cwl2ogc==0.22.2",
  "cwl2oci==0.1.1",
  "cwl2sbom==0.1.1",
  "cwl-baseline-plugin==0.1.1",
  "cwl2codemeta==0.1.1",
  "cwltool>=3.1",
  "PyYAML>=6,<7",
]
dev = ["pytest>=8,<10", "pytest-cov>=6.2,<8", "ruff>=0.16,<0.17", "mypy>=2.3,<3", "bandit>=1.9,<2", "types-PyYAML", "mkdocs-material>=9,<10"]
test = ["pytest>=8.4,<10", "pytest-cov>=6.2,<8"]
