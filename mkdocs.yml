site_name: Water Bodies learning
site_url: https://eoap.github.io/waterbodies-learning/
repo_url: https://github.com/eoap/waterbodies-learning
strict: true
theme:
  name: material
  features:
    - content.code.copy
markdown_extensions:
  - admonition
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
nav:
