name: validate-cwl
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra tooling --extra dev
      - run: uv run cwltool --validate reference/waterbodies.cwl#waterbodies
      - run: uv run cwltool --validate modules/11-assure-the-contract/v1/waterbodies.cwl#waterbodies
      - run: uv run cwltool --validate modules/11-assure-the-contract/v2/waterbodies.cwl#waterbodies
